name: Live integration

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

jobs:
  guardrail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Example QR codes against staging and production
        run: dart test test/example_qr_codes_test.dart
